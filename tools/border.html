<!doctype html>
<meta charset="utf-8">
<title>sindenrs border</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #b { position: fixed; inset: 0; border: 3vh solid #fff; box-sizing: border-box; }
  #c { position: fixed; left: 50%; top: 50%; width: 2vh; height: 2vh; margin: -1vh 0 0 -1vh;
       border: 2px solid #f33; border-radius: 50%; }
  #t { position: fixed; left: 50%; top: 50%; width: 40vh; height: 40vh; margin: -20vh 0 0 -20vh;
       border: 1px dashed #444; border-radius: 50%; }
  #h { position: fixed; bottom: 5vh; width: 100%; text-align: center; color: #555; font: 2vh sans-serif; }
</style>
<div id="b"></div><div id="t"></div><div id="c"></div>
<div id="h">F11 for fullscreen · keys: w/n = border width · b = toggle border · g = grey background · Esc hides this line</div>
<script>
  let vh = 3, grey = 0;
  const b = document.getElementById('b'), h = document.getElementById('h');
  addEventListener('keydown', e => {
    if (e.key === 'w') vh = Math.min(vh + 0.5, 10);
    if (e.key === 'n') vh = Math.max(vh - 0.5, 0.5);
    if (e.key === 'b') b.style.display = b.style.display === 'none' ? '' : 'none';
    if (e.key === 'g') { grey = (grey + 40) % 160; document.body.style.background = `rgb(${grey},${grey},${grey})`; }
    if (e.key === 'Escape') h.style.display = 'none';
    b.style.borderWidth = vh + 'vh';
  });
</script>
