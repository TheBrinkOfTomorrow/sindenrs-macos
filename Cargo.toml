[package]
name = "sindenrs"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Clean-room Linux/Windows driver for the Sinden Lightgun"
readme = "README.md"
keywords = ["lightgun", "sinden", "v4l2"]
categories = ["command-line-utilities", "hardware-support"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.11"
# default-features = false drops the libudev dependency; we discover devices via sysfs ourselves.
serialport = { version = "4", default-features = false }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zune-jpeg = "0.5"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
ctrlc = "3.5.2"
toml_edit = "0.25.15"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
# The overlay window. x11rb's RustConnection and wayland-backend's Rust backend need no
# libX11 / libwayland at all, so the binary loads no system libraries for the window.
x11rb = { version = "0.13", features = ["shape", "randr"] }
smithay-client-toolkit = { version = "0.19", default-features = false }
wayland-client = "0.31"

[target.'cfg(target_os = "macos")'.dependencies]
# IOKit registry access for discovery; both already come in through serialport on macOS.
core-foundation = "0.10"
io-kit-sys = "0.4"
# AVFoundation capture.
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media"] }
objc2-core-media = "0.3"
objc2-core-video = "0.3"
dispatch2 = "0.3"
block2 = "0.6"

[dev-dependencies]

[lints.rust]
unsafe_code = "warn"
missing_docs = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
nursery = { level = "allow", priority = -1 }

enum_glob_use = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
ptr_as_ptr = "warn"
redundant_closure_for_method_calls = "warn"
unwrap_used = "warn"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.test]
opt-level = 0
debug = true
